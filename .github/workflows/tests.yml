name: Tests
on:
  pull_request:
  push:
    branches: [main, codex/v240-dashboard-rotation]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Run regression shard
        env:
          TEST_SHARD: ${{ matrix.shard }}
        run: |
          node - <<'NODE'
          const {spawnSync}=require('node:child_process');
          const files=require('node:fs').readdirSync('tests').filter(file=>file.endsWith('.cjs')).sort()
            .filter((_,index)=>index%3===Number(process.env.TEST_SHARD)).map(file=>'tests/'+file);
          const result=spawnSync(process.execPath,['--test',...files],{stdio:'inherit'});
          process.exit(result.status??1);
          NODE
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:tv
      - run: git diff --exit-code -- dashboard-compat.html tv-compat
      - run: node --test tests/v239-dashboard-layout.cjs tests/v240-dashboard-rotation.cjs tests/v253-tiberius-turns.cjs
  station-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run test:station-rules
